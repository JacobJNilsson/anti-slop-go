version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - gocritic
    - bodyclose
    - noctx
    - revive
    - unparam
  settings:
    govet:
      disable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: duplicated-imports
        - name: modifies-value-receiver
  exclusions:
    paths:
      # Analyzer fixtures are deliberately bad code: they exist to
      # trigger diagnostics and must not be linted as project source.
      - "(^|/)testdata/"

formatters:
  enable:
    - gofmt
    - goimports
